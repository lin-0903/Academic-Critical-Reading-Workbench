const seed=[{"id":"w4-riegl-1903","week":"Week 4 · Conservation Values","course":"Conservation Principles, Practice & Ethics","title":"The Modern Cult of Monuments: Its Essence and Its Development","author":"Alois Riegl","year":1903,"venue":"Readings in Conservation (1996 translation), pp. 69–83","url":"https://www.getty.edu/publications/virtuallibrary/9780892363988.html","pdf":"","tags":["Heritage Theory","Values","Riegl"],"status":"基于上传 PDF 全文提取与定位；OCR 存在断词/拼写错误，正式引用请人工检查原图","offset":"印刷 p.69 = PDF p.1；印刷 p.83 = PDF p.15。PDF pp.16–17 为文集前后附页；按印刷 p. = PDF 页 +68。","summary":"Riegl 不把“monument 的价值”理解成唯一且客观的属性：有意纪念与后人赋予意义的非有意纪念物不同；年代价值、历史价值、有意纪念价值与当代使用/新颖价值之间可能互相冲突。保护决策因此必须理解不同价值要求，而不能只使用单一的修复准则。","question":"一处遗迹为什么值得保留？其价值究竟来自建造者的原始意图、物质时间痕迹，还是今天的人们赋予它的意义？","argument":[{"title":"§1 · 从 intentional monument 到价值由后人赋予","body":"现代人经常将并非原为纪念而造的物件视为历史纪念物；价值判断包含观看者的选择。","ref":"p.69–72 / PDF 1–4"},{"title":"Age value（年代价值）","body":"可见的老化、残缺与自然风化能够体现时间的作用；明显修复可能与此价值冲突。","ref":"p.72–75 / PDF 4–7"},{"title":"Historical value（历史价值）","body":"遗迹是特定发展阶段不可替代的历史证据，这种价值往往要求限制未来物质改变。","ref":"p.75–77 / PDF 7–9"},{"title":"Use & Newness values（当代价值）","body":"现实使用与对完整崭新外观的偏好可能支持维护或修复，与 age value 发生张力。","ref":"pp.79–83 / PDF 11–15"}],"anchors":[{"ref":"印刷 p.69 / PDF p.1","place":"§1 第一段：\"In its oldest and most original sense...\"","why":"定义 deliberate monument；别把 monument 等同于今日指定古迹。","page":1},{"ref":"印刷 pp.71–72 / PDF pp.3–4","place":"§1 末尾：\"We modern viewers...\"","why":"现代观者赋予非有意纪念物意义，是作者的关键转折。","page":3},{"ref":"印刷 pp.72–73 / PDF pp.4–5","place":"§2 A. Age Value，开头两段","why":"分辨可见老化与美术史专家判断。","page":4},{"ref":"印刷 pp.73–74 / PDF pp.5–6","place":"Age Value：\"From the hand of man...\"","why":"自然衰败的时间痕迹为何能构成审美价值。","page":5},{"ref":"印刷 pp.75–77 / PDF pp.7–9","place":"Historical Value 小节","why":"与 age value 的保存要求区别。","page":7},{"ref":"印刷 pp.79–80 / PDF pp.11–12","place":"A. Use Value","why":"建筑持续使用所需的干预为何产生价值冲突。","page":11},{"ref":"印刷 pp.80–83 / PDF pp.12–15","place":"Newness Value 与 Relative Artistic Value","why":"与历史/年代价值相抗衡的当代审美要求。","page":12}],"examples":[{"title":"刻有事件的有意纪念物 · p.69","body":"建造者从一开始就想让后世记住特定人物或事件，这是 deliberate monument；与后来被赋予价值的对象不同。"},{"title":"一张残存的纸片 · pp.70–71","body":"Riegl 用微不足道的纸片解释：如果它是某种历史艺术实践的唯一证据，即使不起眼也可能成为重要历史纪念物。"},{"title":"老化痕迹与修复 · pp.73–74","body":"年代价值重视不完整和风化；过于显眼的新修复可能破坏这种时间感。"}],"glossary":[["Deliberate monument","有意纪念物","建造时即以纪念为目的；p.69"],["Unintentional monument","非有意纪念物","后世对并非原为纪念而造之物赋予纪念意义；p.72"],["Age value","年代价值","依赖可见风化、残缺与时间痕迹；pp.72–75"],["Historical value","历史价值","把遗迹视为某个发展阶段的历史证据；pp.75–77"],["Use value","使用价值","与现实生活和实用功能相关；pp.79–80"],["Newness value","新颖价值","偏好完好如新的形式或外观；pp.80–82"],["Kunstwollen","艺术意志","特定时代/主体的艺术偏好而非永恒审美法则；p.71"]],"critique":"作为建筑保护实践的延伸问题（非作者原话）：建筑外墙有明显风化但仍在使用时，谁来权衡 age value、historical value 与 use value？对于安全需要进行补强时，怎样记录价值权衡过程？","quiz":[{"q":"哪一项最能区分 deliberate 与 unintentional monuments？","options":["材料年代是否古老","建造时是否明确具有纪念目的","现在是否受法律保护"],"answer":1,"why":"§1：区别在原始目的与后人赋予的价值。"},{"q":"Age value 首先重视什么？","options":["可见老化与不完整的时间痕迹","恢复原貌","博物馆门票收入"],"answer":0,"why":"§2 A：风化、缺损等体现自然与时间的过程。"},{"q":"仍在使用的老建筑为何构成难题？","options":["所有价值都要求立即拆除","使用需要维护，而某些修补会妨碍年代价值","建筑价值取决于设计师名气"],"answer":1,"why":"Use value 与 age value 在实践中可能冲突。"}],"openQuestion":"挑选一栋仍在使用的历史建筑。用 100–150 字区分它的 age value、historical value 和 use value，并说明一次必要的安全修缮可能如何改变三者关系。","concepts":["[[Age Value]]","[[Historical Value]]","[[Use Value]]","[[Newness Value]]","[[Heritage Values]]"]},{"id":"w4-clavir-2002","week":"Week 4 · Conservation Values","course":"Conservation Principles, Practice & Ethics","title":"Conservation Values and Ethics (Chapter 2)","author":"Miriam Clavir","year":2002,"venue":"Preserving What Is Valued, pp.26–66","url":"","pdf":"","tags":["Museum Ethics","First Nations","Conservation Values"],"status":"基于上传 PDF 全文提取与定位；OCR 存在断词/拼写错误，正式引用请人工检查原图","offset":"PDF p.1 封面、p.2 目录；PDF p.3 左页为印刷 p.26、右页 p.27；PDF p.4 = pp.28–29，依次类推。PDF p.23 = 印刷 p.66（单页）。扫描为双栏两页拼图，务必核对左/右页。","summary":"Clavir 考察 conservation va function progress(){let p=state.progress[state.selected];if(!p)p=state.progress[state.selected]={answers:{},annotations:[],notes:'',reflection:'',stage:0};return p}function article(){return state.articles.find(a=>a.id===state.selected)||state.articles[0]}function graphView(){return graphViews.find(g=>g.id===state.selected)||null}function isGraphSelected(){return !!graphView()}function isComplete(id){const a=state.articles.find(x=>x.id===id);const p=state.progress[id]||{};return a?.quiz?.length&&Object.keys(p.answers||{}).length===a.quiz.length&&String(p.reflection||'').trim().length>=30}function nav(){let groups=[...new Set(state.articles.map(a=>a.week))];document.getElementById('nav').innerHTML=groups.map(week=>`<button class="week" data-week="${escapeHTML(week)}">▾ ${escapeHTML(week)}</button><div>${state.articles.filter(a=>a.week===week).map(a=>`<button class="navitem ${a.id===state.selected?'active':''}" data-id="${escapeHTML(a.id)}">${escapeHTML(a.author.split(' ').slice(-1)[0])} (${a.year})<small>${isComplete(a.id)?'✓ 已完成':'○ 阅读中 · 点击进入'}</small></button>`).join('')}</div>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.id;save();render()});document.querySelectorAll('[data-week]').forEach(b=>b.onclick=()=>{b.nextElementSibling.hidden=!b.nextElementSibling.hidden})}
function render(){if(isGraphSelected()){renderGraph();nav();return}const a=article(),p=progress(),q=a.quiz||[];let done=Object.keys(p.answers||{}).length;const evidence=a.anchors||[];document.getElementById('content').innerHTML=`<div class="eyebrow">${escapeHTML(a.week)} / Guided Close Reading</div><h1 class="article-title">${escapeHTML(a.title)}</h1><div class="meta">${escapeHTML(a.author)} · ${escapeHTML(a.year)} · ${escapeHTML(a.venue)}<br><a target="_blank" rel="noopener" href="${escapeHTML(a.url||'#')}">Source / 原始来源 ↗</a> · <a target="_blank" rel="noopener" href="${escapeHTML(encodeURI(a.pdf||''))}">打开上传 PDF ↗</a></div><div class="tags">${(a.tags||[]).map(t=>`<span class="tag">${escapeHTML(t)}</span>`).join('')}</div><div class="notice"><strong>来源核验：</strong> ${escapeHTML(a.status||'未验证')}<br>${escapeHTML(a.offset||'请核对 PDF 与印刷页码。')}<br><b>重要：</b> 下方是源文支持的解释性学习笔记，不是完整 PDF，也不代替逐页核对原文。</div><div class="section"><div class="sub">Progress / 理解检测</div><div class="meter"><div style="width:${Math.round((done/(q.length||1))*100)}%"></div></div><span class="hint">${done}/${q.length} 道选择题 · 开放题 ${p.reflection?.trim().length>=30?'已提交':'未提交'} · ${isComplete(a.id)?'已完成':'请先完成理解检测再标记完成'}</span></div><section class="section annotatable" id="reading"><h2>01 · 阅读地图 / Reading Map</h2><h3>Research Question</h3><div class="note"><p>${escapeHTML(a.question)}</p></div><h3>One-minute Summary</h3><p>${escapeHTML(a.summary)}</p><h3>Argument Map</h3>${(a.argument||[]).map((x,i)=>`<div class="note ${i===1?'term':i===2?'finding':''}"><b>${escapeHTML(x.title)}</b><p>${escapeHTML(x.body)}</p><span class="hint">${escapeHTML(x.ref)}</span></div>`).join('')}<h2 style="margin-top:30px">02 · 精读锚点 / Evidence Anchors</h2>${evidence.map(x=>`<div class="evidence"><div><b>${escapeHTML(x.place)}</b><p style="margin:2px 0">${escapeHTML(x.why)}</p></div><span class="ref">${escapeHTML(x.ref)}<br><a target="_blank" rel="noopener" href="${escapeHTML(encodeURI(a.pdf||''))}#page=${Number(x.page)||1}">打开 PDF ↗</a></span></div>`).join('')}<h2 style="margin-top:30px">03 · 案例 / Examples</h2>${(a.examples||[]).map(x=>`<details><summary>${escapeHTML(x.title)}</summary><p>${escapeHTML(x.body)}</p></details>`).join('')}<h2 style="margin-top:30px">04 · Bilingual Glossary</h2><div style="overflow-x:auto"><table><thead><tr><th>English</th><th>中文</th><th>本文含义 / 页码</th></tr></thead><tbody>${(a.glossary||[]).map(x=>`<tr>${x.map(v=>`<td>${escapeHTML(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><h2 style="margin-top:30px">05 · Critical Reading</h2><div class="note critical"><b>一个可讨论的研究问题（非作者原话）</b><p>${escapeHTML(a.critique)}</p></div></section><section class="section"><h2>06 · Active Recall / 理解检测</h2><p class="hint">先在不看笔记的情况下回答；选中选项后才显示解释。</p><div id="quiz"></div><h3>开放式论证题</h3><p>${escapeHTML(a.openQuestion)}</p><textarea id="reflection" placeholder="先写自己的理解，再回到原文核对……">${escapeHTML(p.reflection||'')}</textarea><div class="hint">至少 30 字可以完成本篇检测。答案由你自己撰写；此版不会声称自动评阅开放题。</div><div style="margin-top:12px" id="finishstatus"></div></section><section class="section"><h2>07 · 高亮摘录与批注</h2><p class="hint">用鼠标选择上面的学习正文，选区下方会出现黄 / 绿 / 粉高亮菜单。可附备注，支持编辑备注及删除高亮。</p><div id="annotations"></div></section><section class="section"><h2>08 · My Notes / 自己的研究笔记</h2><textarea id="notes" placeholder="我的观点、相关文献联系、课堂问题、后续研究……">${escapeHTML(p.notes||'')}</textarea><p class="hint">保存内容可导出为带 [[Concept Links]] 的 Obsidian Markdown。</p><div class="right"><button class="btn" id="exportSingle">导出这篇 .md ↗</button></div></section><div class="footer">Academic Critical Reading Workbench · Offline HTML · localStorage persistence · No background sync</div>`;renderQuiz();renderAnnotations();applyHighlights();document.getElementById('notes').addEventListener('input',e=>{progress().notes=e.target.value;save()});document.getElementById('reflection').addEventListener('input',e=>{progress().reflection=e.target.value;save();finishStatus()});document.getElementById('exportSingle').onclick=()=>exportMd(article());document.getElementById('reading').addEventListener('mouseup',captureSelection);document.getElementById('reading').addEventListener('touchend',()=>setTimeout(captureSelection,100));finishStatus();nav()}
function renderQuiz(){const a=article(),p=progress();document.getElementById('quiz').innerHTML=(a.quiz||[]).map((x,i)=>`<div style="margin:18px 0"><b style="font-size:13px">${i+1}. ${escapeHTML(x.q)}</b>${x.options.map((t,j)=>`<label class="option"><input type="radio" name="q${i}" data-q="${i}" value="${j}" ${p.answers[i]===j?'checked':''}>${escapeHTML(t)}</label>`).join('')}${p.answers[i]===undefined?'':`<div class="feedback">${p.answers[i]===x.answer?'✓ 正确':'✕ 需要重读'} · ${escapeHTML(x.why)}</div>`}</div>`).join('');document.querySelectorAll('[data-q]').forEach(e=>e.onchange=()=>{progress().answers[Number(e.dataset.q)]=Number(e.value);save();renderQuiz();finishStatus();nav()})}function finishStatus(){const p=progress(),a=article();document.getElementById('finishstatus').innerHTML=isComplete(a.id)?'<span class="status">✓ 已完成本篇的最低理解检测，可以进入下一篇。</span>':'<span class="hint">尚未完成全部 3 道选择题和开放题。</span>'}
function fullOffset(root,node,pos){const range=document.createRange();range.selectNodeContents(root);range.setEnd(node,pos);return range.toString().length}function captureSelection(){const sel=window.getSelection(),root=document.getElementById('reading');if(!sel||sel.isCollapsed||!root.contains(sel.anchorNode)||!root.contains(sel.focusNode))return;const r=sel.getRangeAt(0);const quote=sel.toString().trim();if(!quote||quote.length>600)return;selectedOffsets={start:fullOffset(root,r.startContainer,r.startOffset),end:fullOffset(root,r.endContainer,r.endOffset),quote};const rect=r.getBoundingClientRect(),box=document.getElementById('floating');box.style.display='flex';box.style.left=Math.max(8,Math.min(window.innerWidth-220,rect.left+window.scrollX))+'px';box.style.top=(rect.bottom+window.scrollY+8)+'px'}function clearFloat(){document.getElementById('floating').style.display='none';window.getSelection()?.removeAllRanges()}
function textBoundary(root,offset){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];let n,total=0;while(n=w.nextNode()){let length=n.nodeValue.length;nodes.push({n,start:total,end:total+length});total+=length}for(const z of nodes){if(offset>=z.start&&offset<=z.end)return{node:z.n,off:offset-z.start}}return nodes.length?{node:nodes[nodes.length-1].n,off:nodes[nodes.length-1].n.nodeValue.length}:null}function applyHighlights(){const root=document.getElementById('reading');const ann=[...(progress().annotations||[])].sort((a,b)=>b.start-a.start);for(const x of ann){try{const start=textBoundary(root,x.start),end=textBoundary(root,x.end);if(!start||!end)continue;let r=document.createRange();r.setStart(start.node,start.off);r.setEnd(end.node,end.off);if(r.toString()!==x.quote)continue;const mark=document.createElement('mark');mark.className='highlight-'+x.color;mark.title=x.note||'高亮';r.surroundContents(mark)}catch(e){/* complex nested markup may be unwrappable; export still retains note */}}}
function renderAnnotations(){const list=document.getElementById('annotations'),ann=progress().annotations||[];list.innerHTML=ann.length?ann.map((x,i)=>`<div class="annotation"><span class="tag" style="background:${{yellow:'#fff2a8',green:'#bcebd0',pink:'#fbd4e7'}[x.color]}">${escapeHTML(x.color)}</span> <q>${escapeHTML(x.quote)}</q><div style="margin:7px 0;color:#65718a">${escapeHTML(x.note||'无备注')}</div><button data-edit="${i}">编辑备注</button><button data-delete="${i}">删除</button></div>`).join(''):'<div class="empty">暂无高亮。可直接选中上方正文开始标注。</div>';list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{progress().annotations.splice(Number(b.dataset.delete),1);save();render()});list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const x=progress().annotations[Number(b.dataset.edit)],v=prompt('编辑备注（取消则不改）',x.note||'');if(v!==null){x.note=v;save();render()}})}document.querySelectorAll('.floating [data-color]').forEach(b=>b.onclick=()=>{if(!selectedOffsets)return;let x={...selectedOffsets,color:b.dataset.color,note:prompt('为这段高亮添加备注（可留空）')||''};if((progress().annotations||[]).some(z=>Math.max(z.start,x.start)<Math.min(z.end,x.end))){alert('此区域已有高亮，请选择不重叠的文本。');clearFloat();return}progress().annotations.push(x);save();clearFloat();render()});document.getElementById('cancelFloat').onclick=clearFloat;
function renderGraph(){const g=graphView();if(!g)return;const color=t=>t==='reading'?'#eaf0ff':'#f5efff';const stroke=t=>t==='reading'?'#3155b6':'#8a60c8';const svg=`<svg class="graphsvg" viewBox="0 0 860 470" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7d89a3"></path></marker></defs>${g.edges.map(e=>{const a=g.nodes.find(n=>n.id===e[0]);const b=g.nodes.find(n=>n.id===e[1]);const mx=(a.x+b.x)/2,my=(a.y+b.y)/2-10;return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#96a2ba" stroke-width="2" stroke-dasharray="${e[2].includes('challenge')||e[2].includes('tension')? '6 5':'0'}" marker-end="url(#arrow)"/><text x="${mx}" y="${my}" font-size="12" text-anchor="middle" fill="#5f6c84">${escapeHTML(e[2])}</text>`}).join('')}${g.nodes.map(n=>`<g><rect x="${n.x-62}" y="${n.y-22}" rx="14" ry="14" width="124" height="44" fill="${color(n.type)}" stroke="${stroke(n.type)}" stroke-width="2"></rect>${n.label.split('\n').map((line,i)=>`<text x="${n.x}" y="${n.y-4 + i*14}" font-size="13" text-anchor="middle" fill="#27344d" font-weight="${i===0?700:500}">${escapeHTML(line)}</text>`).join('')}</g>`).join('')}</svg>`;document.getElementById('content').innerHTML=`<div class="eyebrow">${escapeHTML(g.scope)} / Relation Map</div><h1 class="article-title">${escapeHTML(g.title)}</h1><div class="meta">Graph view · HTML study map · 可作为 Obsidian 概念卡片的总览页</div><div class="tags">${g.legend.map(x=>`<span class="tag">${escapeHTML(x[0])} · ${escapeHTML(x[1])}</span>`).join('')}</div><section class="graphwrap"><h2 style="margin:0 0 12px">阅读关联导图</h2><p class="graphnote">${escapeHTML(g.description)}</p>${svg}<div class="graph-legend">${g.legend.map(x=>`<span class="legend-chip">${escapeHTML(x[0])}：${escapeHTML(x[1])}</span>`).join('')}</div></section><section class="section"><h2>如何阅读这张图</h2><p class="graphnote">蓝色节点是阅读或周次，紫色节点是概念。箭头上的文字表示两者之间的主要关系。实线表示直接论点，虚线表示张力、批判或外延问题。你可以把它看作 seminar discussion 的预习提纲：先解释作者，再解释概念之间的联系，最后指出冲突或延伸。</p><div class="mapcard"><h3 style="margin-top:0">本图的 4 个 takeaway</h3><ul>${g.takeaways.map(t=>`<li>${escapeHTML(t)}</li>`).join('')}</ul></div></section><section class="section"><h2>适合写入 Obsidian 的链接建议</h2><p class="graphnote">建议把下面这些概念做成独立卡片，并从 Literature Notes 互相反向链接：</p><p>${g.nodes.filter(n=>n.type==='concept').map(n=>`<span class="pill" style="margin-right:6px">[[${escapeHTML(n.label.replace(/\n/g,' '))}]]</span>`).join(' ')}</p><div class="right" style="margin-top:15px"><button class="btn" id="exportMap">导出这张图的 .md ↗</button></div></section><div class="footer">Academic Critical Reading Workbench · Relation Maps are synthetic study aids, not substitute for close reading.</div>`;document.getElementById('exportMap').onclick=()=>{const lines=[`---`,`title: "${g.title.replace(/"/g,'\"')}"`,`type: synthesis`,`week: "${g.scope}"`,`tags: [reading-map, synthesis, seminar-prep]`,`---`,`# ${g.title}`,``,`## Description`,g.description,``,`## Takeaways`,...g.takeaways.map(t=>`- ${t}`),``,`## Suggested Links`,...g.nodes.filter(n=>n.type==='concept').map(n=>`- [[${n.label.replace(/\n/g,' ')}]]`),``,`## Edge Notes`,...g.edges.map(e=>`- ${e[0]} → ${e[1]}: ${e[2]}`)];dl(safeName(g.title)+'.md',lines.join('\n'),'text/markdown;charset=utf-8')}}
function safeName(s){return String(s).replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,' ').slice(0,90)}function dl(name,content,mime){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download=name;document.body.appendChild(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function mdQuote(s){return String(s||'').replace(/\r/g,'').replace(/\n/g,' ').trim()}function markdown(a){const p=state.progress[a.id]||{},lines=[`---`,`title: "${a.title.replace(/"/g,'\\"')}"`,`aliases: ["${a.author} (${a.year})"]`,`author: "${a.author}"`,`year: ${a.year}`,`type: literature`,`course: "${a.course||''}"`,`week: "${a.week}"`,`source: "${a.url||''}"`,`tags: [literature, conservation-theory, critical-reading]`,`---`,`# ${a.title}`,`> ${a.author} (${a.year}). ${a.venue}.`,``, `**Source verification:** ${a.status||''}`,`**PDF/print:** ${a.offset||''}`,``,`## Research Question`,a.question,``,`## Thesis / Summary`,a.summary,``,`## Argument Map`,...(a.argument||[]).map(x=>`- **${x.title}** — ${x.body} (${x.ref})`),``,`## Priority Passages`,...(a.anchors||[]).map(x=>`- **${x.ref}** — ${x.place}. ${x.why}`),``,`## Cases`,...(a.examples||[]).map(x=>`- **${x.title}**: ${x.body}`),``,`## Bilingual Glossary`,...(a.glossary||[]).map(x=>`- **${x[0]} / ${x[1]}** — ${x[2]}`),``,`## Critical Reading`,a.critique,``,`## Concepts & Backlinks`,...(a.concepts||[]).map(x=>`- ${x}`),``,`## My Annotations`,...((p.annotations||[]).map(x=>`- **${x.color}**: “${mdQuote(x.quote)}”${x.note?' — '+mdQuote(x.note):''} _(study-note excerpt, not validated quotation from the original PDF)_`)),``,`## Active Recall`,...(a.quiz||[]).map((x,i)=>`- Q${i+1}. ${x.q} — ${p.answers?.[i]===undefined?'Not answered':p.answers[i]===x.answer?'Correct':'Needs review'}`),``,`## Open Response`,p.reflection||'',``,`## My Notes`,p.notes||''];return lines.join('\n')+'\n'}function exportMd(a){dl(safeName(a.author+' '+a.year+' '+a.title)+'.md',markdown(a),'text/markdown;charset=utf-8')}document.getElementById('exportBtn').onclick=()=>exportMd(article());document.getElementById('backupBtn').onclick=()=>dl('reading-workbench-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({...state,format:'academic-reading-workbench-v1'},null,2),'application/json');document.getElementById('importBtn').onclick=()=>document.getElementById('filepick').click();document.getElementById('filepick').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let incoming=JSON.parse(await f.text());if(incoming.format==='academic-reading-workbench-v1'&&Array.isArray(incoming.articles)){if(!confirm('导入备份将替换本机现有工作台数据。建议先导出 JSON 备份。确定继续？'))return;state=incoming;save();render()}else if(incoming.id&&incoming.title&&incoming.author&&Array.isArray(incoming.quiz)){if(state.articles.some(x=>x.id===incoming.id))throw new Error('文章 ID 已存在');state.articles.push(incoming);state.selected=incoming.id;save();render()}else if(Array.isArray(incoming.articles)&&incoming.articles.every(x=>x.id&&x.title)){const ids=new Set(state.articles.map(x=>x.id));const adds=incoming.articles.filter(x=>!ids.has(x.id));state.articles.push(...adds);save();render();alert('已导入 '+adds.length+' 篇文章')}else throw new Error('JSON 格式不支持')}catch(err){alert('导入失败：'+err.message)}finally{e.target.value=''}};document.getElementById('guideBtn').onclick=()=>alert('单篇导出：右上角「导出 Obsidian .md」。请将文件放入 Obsidian Vault 的 01 Literature Notes/。概念链接 [[Object Integrity]] 可在 Obsidian 创建对应卡片。定期导出备份 JSON 并安全保存。本版不是实时双向同步。也可以在左侧打开“关联导图”视图，将其导出为 Obsidian 的综合笔记。');window.addEventListener('scroll',()=>{document.getElementById('floating').style.display='none'},{passive:true});save();render();
</script></body></html>
