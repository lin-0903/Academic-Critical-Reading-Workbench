:"理解工业物与艺术品修复目的区分。"},{"ref":"印刷 p.231 / PDF p.2","place":"“restoration is the methodological moment”附近","why":"核心定义：material form + historical/aesthetic duality。"},{"ref":"印刷 p.231 / PDF p.2","place":"两个 axiom/principle 的连续段落","why":"考试与课堂讨论的关键句：物质形式、潜在整体性、伪造风险。"},{"ref":"印刷 pp.339–342 / 上传 PDF 后半","place":"“Theory of Restoration II”节","why":"继续检验历史性、时间性及干预边界；具体 PDF 段号待核。"}],"examples":[{"title":"Paint loss","body":"缺失部分可通过可辨识的视觉整合改善阅读，但不得伪装为原作。"},{"title":"Historic plaster repair","body":"需判断补配是否掩盖原有材料工艺或历史阶段。"}],"glossary":[["material form","物质形式","承载作品感知的物质基础"],["potential unity","潜在整体性","不等同于完美如新的重建"],["historical/aesthetic duality","历史性与审美性二重性","评价修复的两个维度"]],"critique":"Brandi 的作品概念主要从艺术作品出发；移用于普通居住建筑时，日常使用功能应占何种地位？","quiz":[{"q":"Brandi 的第一原则是？","options":["只有物质形式能被修复","应尽量翻新外观","必须恢复最初用途"],"answer":0,"why":"明确区分 material form 与观念层面的作品。"},{"q":"Potential unity 可以通过伪造实现吗？","options":["可以","不可以","必须这样做"],"answer":1,"why":"第二原则明确禁止历史与艺术伪造。"},{"q":"Brandi 是否认为艺术品修复首先等于恢复功能？","options":["是","否","只讨论结构工程"],"answer":1,"why":"他首先从艺术品作为艺术品的地位出发。"}],"openQuestion":"用一幅缺损的画作和一座仍在居住的老房子，对比 Brandi 两原则的适用性。","concepts":["[[Material Integrity]]","[[Authenticity]]","[[Restoration Debate]]"]},{"id":"w2-viollet-1854","week":"Week 2 · Restoration & Technical Art History","course":"Conservation Principles, Practice & Ethics","title":"Restoration","author":"Eugène-Emmanuel Viollet-le-Duc","year":1854,"venue":"Getty Readings, pp. 314–318","url":"https://www.getty.edu/publications/virtuallibrary/9780892363988.html","pdf":"","tags":["Week 2","Restoration","Architecture"],"status":"课程大纲与提供的文件已核对；页面定位请以印刷页码为准。","offset":"印刷页码与 PDF 页码可能不同；段落以章节/关键词定位，避免未经核实的段号。","summary":"Viollet-le-Duc 将 restoration 与简单维护、修补或重建区别开来：它可能将建筑确立为一个历史上未必曾实际存在的“完成状态”。但他的原文也重视勘察、风格和建造技术，且认为不同历史阶段应依具体情境判断；不应将其简化成“无视证据随意复原”。","question":"以学术知识重建“应当有的完整状态”，何时可能损害实际发生过的建筑历史？","argument":[{"title":"定义与目标","body":"恢复一个完成状态，不一定复制某一真实年代的现状。","ref":"p.314 / PDF p.1"},{"title":"调查与工艺知识","body":"修复前调查各部分年代、风格、后改及区域建造法。"  PDF p.2"}],"anchors":[{"ref":"印刷 p.322 / PDF p.1","place":"“restoration ... most total destruction”开头段落","why":"弄清他反对的“修复”语义。"},{"ref":"印刷 p.323 / PDF p.2","place":"“Take proper care of your monuments”与铁/木支撑段落","why":"重要反例：不是不介入，而是支撑原作。"},{"ref":"印刷 p.323 / PDF p.2","place":"“They are not ours”段落","why":"未来世代与已逝匠人的伦理地位。"}],"examples":[{"title":"Visible timber shoring","body":"宁愿保留明显的支撑而不使历史构件消失；业主可能难以接受外观变化。"}],"glossary":[["anti-restoration","反修复立场","反对伪装的恢复"],["patina","岁月痕迹","原材料长期变化"],["stewardship","托管责任","当前人对过去与未来的义务"]],"critique":"如果业主无法接受显眼的钢构支撑，保留材料完整性还存在什么技术与伦理替代？","quiz":[{"q":"Ruskin 是否反对所有物理干预？","options":["是","否","未提及"],"answer":1,"why":"他赞同可见的结构支撑与持续养护。"},{"q":"其反对 restoration 的主要理由是？","options":["造价太低","原真材料被伪装的新物取代","不喜欢装饰"],"answer":1,"why":"他反对历史失真。"},{"q":"“They are not ours” 意在强调？","options":["私人无限处置权","跨代共享责任","仅政府所有"],"answer":1,"why":"既有过去建造者，也有未来世代权益。"}],"openQuestion":"结合真实客户预算，提出符合 Ruskin 精神但能正常使用的维修建议。","concepts":["[[Restoration Debate]]","[[Material Integrity]]","[[Stewardship]]","[[Minimal Intervention]]"]},{"id":"w2-morris-1877","week":"Week 2 · Restoration & Technical Art History","course":"Conservation Principles, Practice & Ethics","title":"Manifesto of the Society for the Protection of Ancient Buildings","author":"William Morris","year":1877,"venue":"Getty Readings, pp. 319–321","url":"https://www.spab.org.uk/about-us/spab-manifesto","pdf":"","tags":["Week 2","Morris","Anti-restoration"],"status":"课程大纲与提供的文件已核对；页面定位请以印刷页码为准。","offset":"印刷页码与 PDF 页码可能不同；段落以章节/关键词定位，避免未经核实的段号。","summary":"Morris 反对把建筑历史清洗成某个想象中的“最好时期”。多个世纪不断留下的不同风格和修补痕迹，本身就是建筑生命的一部分；现代 restoration 往往以推测性的风格统一破坏这些证据。相对而言，他提倡 protection 与诚实修理，并区分对旧建筑的维护与新建工程。","question":"建筑的多次改建应被视为噪声，还是构成其真实性的历史层？","argument":[{"title":"历史是累积的","body":"不同历史阶段添加的部分可能保留真实而可辨识的时间证据。","ref":"p.319–320 / PDF pp.1–2"},{"title":"反对风格清洗","body":"恢复所谓黄金年代需去除历史材料并补入推测性替代。","ref":"p.320 / PDF p.2"},{"title":"保护与可接受的改变","body":"应尊重原物与时代层次，不把幻想伪装成旧迹。","ref":"p.321 / PDF p.3"}],"anchors":[{"ref":"印刷 p.319 / PDF p.1","place":"Manifesto 开篇与批评 restoration 概念","why":"为什么知识和“修复热情”反而可能破坏。"},{"ref":"印刷 p.320 / PDF p.2","place":"church 一再扩建，各时代留下证据的段落","why":"读懂 historic layering。"},{"ref":"印刷 p.321 / PDF p.3","place":"结尾呼吁保护和修理的部分","why":"将 anti-restoration 转为实践原则。"}],"examples":[{"title":"Layered church","body":"不同世纪的扩建虽风格不一，却展示了建筑真实时间线。"}],"glossary":[["historic layering","历史叠层","后改也是历史证据"],["fabric","原有建筑实体","承载时间与工艺的材料"],["protection","保护","关注现存材料及整体历史"]],"critique":"当适应性再利用需切除部分二十世纪改造痕迹时，Morris 的立场如何指导优先级？","quiz":[{"q":"Morris 怎样看待建筑历代变化？","options":["应全部清除","本身具有历史意义","不允许任何变化发生"],"answer":1,"why":"不同历史阶段可留下可辨的证据。"},{"q":"他反对的复原常常依赖什么？","options":["已确认的原物","修复者的推测与偏好","自动测温"],"answer":1,"why":"正是虚构“最好阶段”引起批评。"},{"q":"Morris 与 Ruskin 最接近的共同关切？","options":["风格统一","反对伪历史和破坏原物","要求外墙全新"],"answer":1,"why":"两者均质疑 restoration 冒充原真的风险。"}],"openQuestion":"选一栋改建多次的建筑：列出你不应因为“风格不协调”而立即拆掉的部分。","concepts":["[[Restoration Debate]]","[[Historic Layering]]","[[Material Integrity]]"]},{"id":"w2-fowler-2019","week":"Week 2 · Restoration & Technical Art History","course":"Conservation Principles, Practice & Ethics","title":"Technical Art History as Method","author":"Caroline Fowler","year":2019,"venue":"The Art Bulletin 101(4), pp. 8–17","url":"https://doi.org/10.1080/00043079.2019.1602446","pdf":"","tags":["Week 2","Technical Art History","Method"],"status":"课程大纲与提供的文件已核对；页面定位请以印刷页码为准。","offset":"印刷 p.8 对应 PDF p.2；p.9 对应 PDF p.3；已读取上传论文第一页与正文起始。","summary":"Fowler 认为 technical art history 不只是为传统艺术史补充材质结果，而是一种重构问题的方法：把制作技术、物质老化、修复过程、科学检测及展示历史纳入关于艺术品本体与艺术史的论证。文章以一幅在修复过程中展出的 Piero di Cosimo 祭坛画切入，并借 Riegl 的 age value / historical value 分析时间痕迹。","question":"如果艺术品在博物馆展示时已是物质变化与过去修复的结果，历史学家还能怎样界定“原作”？","argument":[{"title":"Piero altarpiece","body":"展出修复中的作品让观众看到过去如何被 loss 和 reconstruction 中介。","ref":"pp.8–9 / PDF pp.2–3"},{"title":"与 Riegl 对话","body":"age value 与 historical value 在有损失的物件上并存又张力。","ref":"p.9 / PDF p.3"},{"title":"Method 的意义","body":"技术研究进入艺术史的解释问题，而不仅是验证年代或颜料清单。","ref":"全文 pp.8–17"}],"anchors":[{"ref":"印刷 p.9 / PDF p.3","place":"Piero di Cosimo 的例子首段","why":"保留“修复进行中展示”这一特殊策展行为。"},{"ref":"印刷 p.9 / PDF p.3","place":"引用 Riegl age-value 与 historical-value 的段落","why":"为 W4 Riegl 预习，辨认两类价值的差异。"},{"ref":"印刷 pp.10–17","place":"后续论证及方法反思","why":"将每个技术方法与它真正能回答的历史问题配对。"}],"examples":[{"title":"Piero di Cosimo altarpiece","body":"作品在修复过程中展出，使材料损失与处理决定成为观众看到的历史的一部分。"},{"title":"Chinese silk painting","body":"IRR、UV、微观和颜料检测应回答制作次序与后期修复问题，而非只列仪器名字。"}],"glossary":[["technical art history","技术艺术史","材料与制作证据作为解释方法"],["mediation","中介","物件被保存/修复/展示时的历史传递"],["age value","年代价值","可见的时间变化与残损"]],"critique":"一张 XRF 元素谱如何成为一项艺术史论点，而不是孤立的测试结果？","quiz":[{"q":"Technical art history 是？","options":["只有检测仪器","材料证据与艺术史解释相结合的方法","仅做复制品"],"answer":1,"why":"强调 method 不是 instruments list。"},{"q":"Fowler 的切入案例是？","options":["Piero di Cosimo 修复中的祭坛画","新建教堂","古陶器销售"],"answer":0,"why":"开篇具体案例。"},{"q":"她借谁的价值概念分析老化与历史证据？","options":["Riegl","Morris","Caple"],"answer":0,"why":"与 age value/historical value 对话。"}],"openQuestion":"以你熟悉的一件中国绘画为例，为三种 imaging technique 分别提出一个可检验的艺术史问题。","concepts":["[[Technical Art History]]","[[Age Value]]","[[Historical Value]]","[[Material Evidence]]"]},{"id":"w3-wickens-2024","week":"Week 3 · Climate & Preventive Conservation","course":"Conservation Principles, Practice & Ethics","title":"Preventive Conservation: Continuously Defining Itself at the Crossroads of Theory and Practice","author":"Joelle D. J. Wickens","year":2024,"venue":"Journal of the AIC, online 2024; print 65(1), pp. 3–15 (2026)","url":"https://doi.org/10.1080/01971360.2024.2348924","pdf":"","tags":["Week 3","Preventive Conservation","Sustainability"],"status":"课程大纲与提供的文件已核对；页面定位请以印刷页码为准。","offset":"PDF p.1 为期刊封面；正文印刷 p.3 = PDF p.2，依次递增。在线发表 2024；卷期印刷版标 2026。","summary":"Wickens 通过美国 preventive conservation 的教育和专业组织历程，说明评估优良保护实践的标准从单一严苛的“best practices”，转向依据情境平衡经济、社会与环境可持续性。她认为此转变是职业长期实践的连续进展，并非完全否定早期研究。","question":"如果物件保存与公众使用的需求冲突，什么样的 preventive conservation 才算成功？","argument":[{"title":"旧标准与转变","body":"从统一环境范围和最佳实践导向，走向 context-guided, sustainability-oriented practice。","ref":"印刷 p.3 / PDF p.2, Abstract"},{"title":"专业变化历史","body":"AIC、教育、机构工作者逐步把能源与环境责任纳入专业标准。","ref":"印刷 pp.7–9 / PDF pp.6–8"},{"title":"将使用视为保护目标","body":"要将公众、机构与社群的社会意义纳入维持收藏的理由。","ref":"印刷 pp.10–12 / PDF pp.9–11"}],"anchors":[{"ref":"印刷 p.3 / PDF p.2","place":"Abstract 首两段","why":"作者明确将经济、社会、环境可持续性并列。"},{"ref":"印刷 pp.7–9 / PDF pp.6–8","place":"AIC 改善可持续实践的案例与时间线","why":"留意这是连续改革而非对过去全部否定。"},{"ref":"印刷 pp.10–11 / PDF pp.9–10","place":"curriculum、collection use 的讨论","why":"联系 visible storage 与馆藏可及性。"},{"ref":"印刷 pp.12–15 / PDF pp.11–14","place":"文章总结/结尾","why":"核对何为可持续的 success。"}],"examples":[{"title":"Visible storage","body":"展示库房可能增加馆藏价值可见性与可及性，但不能自动保证低能耗；需看环境控制和游客流量。"},{"title":"WUDPAC curriculum","body":"对比 2009 与 2022 预防性保护教育的侧重。"}],"glossary":[["preventive conservation","预防性保护","在损害发生前管理风险与环境"],["best practices","最佳实践","需要视场地与资源调整"],["context-guided","情境导向","按对象、人员、场地确定方案"]],"critique":"Visible storage 与传统恒温库房：哪种选择在保护成果、社会价值和资源投入上更可持续？","quiz":[{"q":"Wickens 认为成功指标应包括？","options":["仅物件寿命","经济、社会、环境可持续性","仅维持 50% RH"],"answer":1,"why":"摘要直接提出三方面。"},{"q":"她怎样看待旧的保护实践？","options":["全部否定","视作持续改进的基础","主张完全停止预防性保护"],"answer":1,"why":"她强调职业持续演变而非简单推翻。"},{"q":"Visible storage 必然更加节能吗？","options":["是","否，要看建筑环境和使用条件","无论如何不需要环境控制"],"answer":1,"why":"这是结合文章提出的批判性应用题。"}],"openQuestion":"将 Wickens 用于你 Week 3 的 visible-storage 想法：给出一种支持理由、一种反对理由，以及需要量化的数据。","concepts":["[[Preventive Conservation]]","[[Social Sustainability]]","[[Building Use]]","[[Stakeholders]]"]},{"id":"w3-staniforth-2010","week":"Week 3 · Climate & Preventive Conservation","course":"Conservation Principles, Practice & Ethics","title":"Slow Conservation","author":"Sarah Staniforth","year":2010,"venue":"Getty Historical Perspectives on Preventive Conservation, pp. 388–397 (2013 selection)","url":"https://www.getty.edu/publications/virtuallibrary/9781606061428.html","pdf":"","tags":["Week 3","Energy","Passive Control"],"status":"课程大纲与提供的文件已核对；页面定位请以印刷页码为准。","offset":"用户上传的是 2013 Getty 选集页码：PDF p.1 = 印刷 p.388；图和对开扫描部分排版特殊，引用时核对 PDF 图像。","summary":"Staniforth 借 Slow Food 的“重视本地、简朴、可持续”理念，主张 slow preventive conservation：适当而非抽象理想的环境条件；低能耗、可理解、可负担的技术；重新学习传统建筑和社区维护知识。她同时批评高能耗恒定环境标准，讨论馆藏跨洋流动及机构社会支持。","question":"是否有可能以建筑本身的调湿性能和适合地区气候的条件，减少大型 HVAC 的需求？","argument":[{"title":"Slow 的来源","body":"本地性、低能耗、适当尺度与传统工艺是“slow”的理念，而非简单放慢速度。","ref":"印刷 pp.388–389 / PDF pp.1–2"},{"title":"环境足迹","body":"低能耗建筑材料、遮阳/保温、可再生能源和 embodied energy 是实践路径。","ref":"印刷 pp.390–392 / PDF pp.3–6"},{"title":"传统建筑与适当环境","body":"日本 kura 仓储、传统控湿与公众参与，说明技术不必只有精密空调。","ref":"印刷 pp.393–395 / PDF pp.7–9"}],"anchors":[{"ref":"印刷 pp.388–389 / PDF pp.1–2","place":"Slow Food analogy 与 Slow Conservation 起源","why":"留意作者强调 local、appropriate 和 sustainable。"},{"ref":"印刷 p.391 / PDF p.5","place":"Environmental Footprint","why":"将 energy, embodied energy 和 water use 区分。"},{"ref":"印刷 p.393 / PDF p.7","place":"Japanese kura 仓库","why":"理解传统材料与建筑结构的被动调节环境作用。"},{"ref":"印刷 p.394 / PDF p.8","place":"Community involvement & environmental conditions","why":"将公众认可与长期维护联系起来。"},{"ref":"印刷 pp.395–397 / PDF 后段","place":"对环境目标和慢保护的结尾讨论","why":"关注舒适标准如何受到经济/文化背景影响。"}],"examples":[{"title":"Japanese kura","body":"传统日本库房长期保存物件的效果启发新建保存库房的被动式环境设计。"},{"title":"Traditional shutters & curtains","body":"遮阳和重帘可以减缓热损耗；不是所有场景都需昂贵自动系统。"}],"glossary":[["slow conservation","慢保护","以本地适当、低耗能方式持续保存"],["embodied energy","隐含能耗","材料生产、运输和施工的能耗"],["passive climate control","被动式环境控制","利用建筑结构而非完全依靠机械系统"]],"critique":"在炎热潮湿与干燥地区，采用同一种温湿度数值为什么可能不合理？何时被动策略仍不足以保护高敏感藏品？","quiz":[{"q":"Slow conservation 最重视？","options":["越慢越好","低能耗和与地方条件相适应","完全不要监测"],"answer":1,"why":"Slow 强调合适尺度、本地性和可持续。"},{"q":"Kura 案例强调？","options":["传统建筑可帮助形成稳定储藏环境","全部改建为玻璃幕墙","展品必须环游世界"],"answer":0,"why":"利用建筑围护结构和材料特点。"},{"q":"是否意味着禁用现代 HVAC？","options":["是","不是，应根据对象与建筑评估","作者不讨论环境"],"answer":1,"why":"是反思过度能耗与统一标准，非一概排除技术。"}],"openQuestion":"设计一个历史建筑改造的 collection storage 方案：说出被动措施、监测指标、必要时的主动控制。","concepts":["[[Slow Conservation]]","[[Passive Climate Control]]","[[Preventive Conservation]]","[[Ruskin Maintenance]]"]},{"id":"w3-fatoric-2023","week":"Week 3 · Climate & Preventive Conservation","course":"Conservation Principles, Practice & Ethics","title":"Towards a Climate-Smart Cultural Heritage Management","author":"Sandra Fatorić & Cathy Daly","year":2023,"venue":"WIREs Climate Change 14:e855, pp. 1–8","url":"https://doi.org/10.1002/wcc.855","pdf":"","tags":["Week 3","Climate Change","Policy"],"status":"课程大纲与提供的文件已核对；页面定位请以印刷页码为准。","offset":"开放获取 PDF 共 8 页，印刷与 PDF 页码一致；p.4 可定位到“不保证 triple wins”。","summary":"Fatorić 与 Daly 主张将气候变化作为遗产管理的核心问题，而非额外风险。他们提出 climate-smart cultural heritage (CSCH) 作为综合思维：同时考虑适应气候风险、减缓排放与人类安全/社区韧性，但明确指出不是每项实践在每个地点都能实现“三赢”。此框架还需要多方参与和跨部门政策协同。","question":"当 climate adaptation 会改变一处遗产的历史材料时，如何权衡减灾、人类安全与遗产价值？","argument":[{"title":"CSCH 三个目标","body":"降低气候风险、促进减排共同利益并提升 human security；这是综合治理视角。","ref":"PDF pp.1–3, Abstract & §2"},{"title":"不是自动 triple win","body":"地方条件和权衡会让三个目标彼此冲突或轻重不同。","ref":"PDF p.4, §2 末"},{"title":"实现机制","body":"多方参与、跨部门协调、政治支持与资源投资是必要条件。","ref":"PDF pp.4–5, §3"}],"anchors":[{"ref":"PDF p.1","place":"Abstract / CSCH definition","why":"作者对 CSCH 的明确定义。"},{"ref":"PDF p.3","place":"Figure 1 & §2 framework","why":"用自己的话画出 adaptation/mitigation/human security 关系。"},{"ref":"PDF p.4","place":"“triple wins”限制的段落","why":"记住作者不是承诺所有项目一定三赢。"},{"ref":"PDF pp.4–5","place":"§3 Means for achieving CSCH management","why":"标注 multi-stakeholder planning 与机构转型机制。"},{"ref":"PDF pp.5–7","place":"作者应用与讨论小节","why":"辨认具体政策/文化景观案例并注意尺度限制。"}],"examples":[{"title":"Local materials and community construction","body":"比较因地制宜的建材、知识与社区建设如何产生减排与适应收益；具体案例需核对原文。"},{"title":"Historic flood systems","body":"传统防洪和地景可能提供气候适应知识，但不能假定总是足够应对未来风险。"}],"glossary":[["climate adaptation","气候适应","降低气候变化造成的损失"],["mitigation","减缓","降低温室气体排放"],["human security","人类安全","生计、健康、文化安全与韧性"]],"critique":"若保护一处海岸遗址需要高碳排、耗费巨资的硬质海堤，CSCH 如何对三种目标排序？","quiz":[{"q":"CSCH 包含哪些方面？","options":["只有材料检测","适应、减缓、人类安全","只有旅游收益"],"answer":1,"why":"定义中的三方面。"},{"q":"每项 CSCH 都必须实现 triple win 吗？","options":["是","否","只有博物馆可以"],"answer":1,"why":"作者明确提示没有保证。"},{"q":"实现 CSCH 需要？","options":["孤立的专家决定","跨部门与相关群体共同规划","停止所有政策参与"],"answer":1,"why":"强调 multi-stakeholder planning 和机构机制。"}],"openQuestion":"选择一处历史建筑的 flood adaptation 措施，给 adaptation、mitigation、human security 各设一条评估标准。","concepts":["[[Climate Adaptation]]","[[Mitigation]]","[[Human Security]]","[[Stakeholders]]"]},{"id":"w4-riegl-1903","week":"Week 4 · Conservation Values","course":"Conservation Principles, Practice & Ethics","title":"The Modern Cult of Monuments: Its Essence and Its Development","author":"Alois Riegl","year":1903,"venue":"Readings in Conservation (1996 translation), pp. 69–83","url":"https://www.getty.edu/publications/virtuallibrary/9780892363988.html","pdf":"","tags":["Heritage Theory","Values","Riegl"],"status":"基于上传 PDF 全文提取与定位；OCR 存在断词/拼写错误，正式引用请人工检查原图","offset":"印刷 p.69 = PDF p.1；印刷 p.83 = PDF p.15。PDF pp.16–17 为文集前后附页；按印刷 p. = PDF 页 +68。","summary":"Riegl 不把“monument 的价值”理解成唯一且客观的属性：有意纪念与后人赋予意义的非有意纪念物不同；年代价值、历史价值、有意纪念价值与当代使用/新颖价值之间可能互相冲突。保护决策因此必须理解不同价值要求，而不能只使用单一的修复准则。","question":"一处遗迹为什么值得保留？其价值究竟来自建造者的原始意图、物质时间痕迹，还是今天的人们赋予它的意义？","argument":[{"title":"§1 · 从 intentional monument 到价值由后人赋予","body":"现代人经常将并非原为纪念而造的物件视为历史纪念物；价值判断包含观看者的选择。","ref":"p.69–72 / PDF 1–4"},{"title":"Age value（年代价值）","body":"可见的老化、残缺与自然风化能够体现时间的作用；明显修复可能与此价值冲突。","ref":"p.72–75 / PDF 4–7"},{"title":"Historical value（历史价值）","body":"遗迹是特定发展阶段不可替代的历史证据，这种价值往往要求限制未来物质改变。","ref":"p.75–77 / PDF 7–9"},{"title":"Use & Newness values（当代价值）","body":"现实使用与对完整崭新外观的偏好可能支持维护或修复，与 age value 发生张力。","ref":"pp.79–83 / PDF 11–15"}],"anchors":[{"ref":"印刷 p.69 / PDF p.1","place":"§1 第一段：\"In its oldest and most original sense...\"","why":"定义 deliberate monument；别把 monument 等同于今日指定古迹。","page":1},{"ref":"印刷 pp.71–72 / PDF pp.3–4","place":"§1 末尾：\"We modern viewers...\"","why":"现代观者赋予非有意纪念物意义，是作者的关键转折。","page":3},{"ref":"印刷 pp.72–73 / PDF pp.4–5","place":"§2 A. Age Value，开头两段","why":"分辨可见老化与美术史专家判断。","page":4},{"ref":"印刷 pp.73–74 / PDF pp.5–6","place":"Age Value：\"From the hand of man...\"","why":"自然衰败的时间痕迹为何能构成审美价值。","page":5},{"ref":"印刷 pp.75–77 / PDF pp.7–9","place":"Historical Value 小节","why":"与 age value 的保存要求区别。","page":7},{"ref":"印刷 pp.79–80 / PDF pp.11–12","place":"A. Use Value","why":"建筑持续使用所需的干预为何产生价值冲突。","page":11},{"ref":"印刷 pp.80–83 / PDF pp.12–15","place":"Newness Value 与 Relative Artistic Value","why":"与历史/年代价值相抗衡的当代审美要求。","page":12}],"examples":[{"title":"刻有事件的有意纪念物 · p.69","body":"建造者从一开始就想让后世记住特定人物或事件，这是 deliberate monument；与后来被赋予价值的对象不同。"},{"title":"一张残存的纸片 · pp.70–71","body":"Riegl 用微不足道的纸片解释：如果它是某种历史艺术实践的唯一证据，即使不起眼也可能成为重要历史纪念物。"},{"title":"老化痕迹与修复 · pp.73–74","body":"年代价值重视不完整和风化；过于显眼的新修复可能破坏这种时间感。"}],"glossary":[["Deliberate monument","有意纪念物","建造时即以纪念为目的；p.69"],["Unintentional monument","非有意纪念物","后世对并非原为纪念而造之物赋予纪念意义；p.72"],["Age value","年代价值","依赖可见风化、残缺与时间痕迹；pp.72–75"],["Historical value","历史价值","把遗迹视为某个发展阶段的历史证据；pp.75–77"],["Use value","使用价值","与现实生活和实用功能相关；pp.79–80"],["Newness value","新颖价值","偏好完好如新的形式或外观；pp.80–82"],["Kunstwollen","艺术意志","特定时代/主体的艺术偏好而非永恒审美法则；p.71"]],"critique":"作为建筑保护实践的延伸问题（非作者原话）：建筑外墙有明显风化但仍在使用时，谁来权衡 age value、historical value 与 use value？对于安全需要进行补强时，怎样记录价值权衡过程？","quiz":[{"q":"哪一项最能区分 deliberate 与 unintentional monuments？","options":["材料年代是否古老","建造时是否明确具有纪念目的","现在是否受法律保护"],"answer":1,"why":"§1：区别在原始目的与后人赋予的价值。"},{"q":"Age value 首先重视什么？","options":["可见老化与不完整的时间痕迹","恢复原貌","博物馆门票收入"],"answer":0,"why":"§2 A：风化、缺损等体现自然与时间的过程。"},{"q":"仍在使用的老建筑为何构成难题？","options":["所有价值都要求立即拆除","使用需要维护，而某些修补会妨碍年代价值","建筑价值取决于设计师名气"],"answer":1,"why":"Use value 与 age value 在实践中可能冲突。"}],"openQuestion":"挑选一栋仍在使用的历史建筑。用 100–150 字区分它的 age value、historical value 和 use value，并说明一次必要的安全修缮可能如何改变三者关系。","concepts":["[[Age Value]]","[[Historical Value]]","[[Use Value]]","[[Newness Value]]","[[Heritage Values]]"]},{"id":"w4-clavir-2002","week":"Week 4 · Conservat function fullOffset(root,node,pos){const range=document.createRange();range.selectNodeContents(root);range.setEnd(node,pos);return range.toString().length}function captureSelection(){const sel=window.getSelection(),root=document.getElementById('reading');if(!sel||sel.isCollapsed||!root.contains(sel.anchorNode)||!root.contains(sel.focusNode))return;const r=sel.getRangeAt(0);const quote=sel.toString().trim();if(!quote||quote.length>600)return;selectedOffsets={start:fullOffset(root,r.startContainer,r.startOffset),end:fullOffset(root,r.endContainer,r.endOffset),quote};const rect=r.getBoundingClientRect(),box=document.getElementById('floating');box.style.display='flex';box.style.left=Math.max(8,Math.min(window.innerWidth-220,rect.left+window.scrollX))+'px';box.style.top=(rect.bottom+window.scrollY+8)+'px'}function clearFloat(){document.getElementById('floating').style.display='none';window.getSelection()?.removeAllRanges()}
function textBoundary(root,offset){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];let n,total=0;while(n=w.nextNode()){let length=n.nodeValue.length;nodes.push({n,start:total,end:total+length});total+=length}for(const z of nodes){if(offset>=z.start&&offset<=z.end)return{node:z.n,off:offset-z.start}}return nodes.length?{node:nodes[nodes.length-1].n,off:nodes[nodes.length-1].n.nodeValue.length}:null}function applyHighlights(){const root=document.getElementById('reading');const ann=[...(progress().annotations||[])].sort((a,b)=>b.start-a.start);for(const x of ann){try{const start=textBoundary(root,x.start),end=textBoundary(root,x.end);if(!start||!end)continue;let r=document.createRange();r.setStart(start.node,start.off);r.setEnd(end.node,end.off);if(r.toString()!==x.quote)continue;const mark=document.createElement('mark');mark.className='highlight-'+x.color;mark.title=x.note||'高亮';r.surroundContents(mark)}catch(e){/* complex nested markup may be unwrappable; export still retains note */}}}
function renderAnnotations(){const list=document.getElementById('annotations'),ann=progress().annotations||[];list.innerHTML=ann.length?ann.map((x,i)=>`<div class="annotation"><span class="tag" style="background:${{yellow:'#fff2a8',green:'#bcebd0',pink:'#fbd4e7'}[x.color]}">${escapeHTML(x.color)}</span> <q>${escapeHTML(x.quote)}</q><div style="margin:7px 0;color:#65718a">${escapeHTML(x.note||'无备注')}</div><button data-edit="${i}">编辑备注</button><button data-delete="${i}">删除</button></div>`).join(''):'<div class="empty">暂无高亮。可直接选中上方正文开始标注。</div>';list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{progress().annotations.splice(Number(b.dataset.delete),1);save();render()});list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const x=progress().annotations[Number(b.dataset.edit)],v=prompt('编辑备注（取消则不改）',x.note||'');if(v!==null){x.note=v;save();render()}})}document.querySelectorAll('.floating [data-color]').forEach(b=>b.onclick=()=>{if(!selectedOffsets)return;let x={...selectedOffsets,color:b.dataset.color,note:prompt('为这段高亮添加备注（可留空）')||''};if((progress().annotations||[]).some(z=>Math.max(z.start,x.start)<Math.min(z.end,x.end))){alert('此区域已有高亮，请选择不重叠的文本。');clearFloat();return}progress().annotations.push(x);save();clearFloat();render()});document.getElementById('cancelFloat').onclick=clearFloat;
function safeName(s){return String(s).replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,' ').slice(0,90)}function dl(name,content,mime){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download=name;document.body.appendChild(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function mdQuote(s){return String(s||'').replace(/\r/g,'').replace(/\n/g,' ').trim()}function markdown(a){const p=state.progress[a.id]||{},lines=[`---`,`title: "${a.title.replace(/"/g,'\\"')}"`,`aliases: ["${a.author} (${a.year})"]`,`author: "${a.author}"`,`year: ${a.year}`,`type: literature`,`course: "${a.course||''}"`,`week: "${a.week}"`,`source: "${a.url||''}"`,`tags: [literature, conservation-theory, critical-reading]`,`---`,`# ${a.title}`,`> ${a.author} (${a.year}). ${a.venue}.`,``, `**Source verification:** ${a.status||''}`,`**PDF/print:** ${a.offset||''}`,``,`## Research Question`,a.question,``,`## Thesis / Summary`,a.summary,``,`## Argument Map`,...(a.argument||[]).map(x=>`- **${x.title}** — ${x.body} (${x.ref})`),``,`## Priority Passages`,...(a.anchors||[]).map(x=>`- **${x.ref}** — ${x.place}. ${x.why}`),``,`## Cases`,...(a.examples||[]).map(x=>`- **${x.title}**: ${x.body}`),``,`## Bilingual Glossary`,...(a.glossary||[]).map(x=>`- **${x[0]} / ${x[1]}** — ${x[2]}`),``,`## Critical Reading`,a.critique,``,`## Concepts & Backlinks`,...(a.concepts||[]).map(x=>`- ${x}`),``,`## My Annotations`,...((p.annotations||[]).map(x=>`- **${x.color}**: “${mdQuote(x.quote)}”${x.note?' — '+mdQuote(x.note):''} _(study-note excerpt, not validated quotation from the original PDF)_`)),``,`## Active Recall`,...(a.quiz||[]).map((x,i)=>`- Q${i+1}. ${x.q} — ${p.answers?.[i]===undefined?'Not answered':p.answers[i]===x.answer?'Correct':'Needs review'}`),``,`## Open Response`,p.reflection||'',``,`## My Notes`,p.notes||''];return lines.join('\n')+'\n'}function exportMd(a){dl(safeName(a.author+' '+a.year+' '+a.title)+'.md',markdown(a),'text/markdown;charset=utf-8')}document.getElementById('exportBtn').onclick=()=>exportMd(article());document.getElementById('backupBtn').onclick=()=>dl('reading-workbench-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({...state,format:'academic-reading-workbench-v1'},null,2),'application/json');document.getElementById('importBtn').onclick=()=>document.getElementById('filepick').click();document.getElementById('filepick').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let incoming=JSON.parse(await f.text());if(incoming.format==='academic-reading-workbench-v1'&&Array.isArray(incoming.articles)){if(!confirm('导入备份将替换本机现有工作台数据。建议先导出 JSON 备份。确定继续？'))return;state=incoming;save();render()}else if(incoming.id&&incoming.title&&incoming.author&&Array.isArray(incoming.quiz)){if(state.articles.some(x=>x.id===incoming.id))throw new Error('文章 ID 已存在');state.articles.push(incoming);state.selected=incoming.id;save();render()}else if(Array.isArray(incoming.articles)&&incoming.articles.every(x=>x.id&&x.title)){const ids=new Set(state.articles.map(x=>x.id));const adds=incoming.articles.filter(x=>!ids.has(x.id));state.articles.push(...adds);save();render();alert('已导入 '+adds.length+' 篇文章')}else throw new Error('JSON 格式不支持')}catch(err){alert('导入失败：'+err.message)}finally{e.target.value=''}};document.getElementById('localPdfPick').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const uri=URL.createObjectURL(f);const win=window.open(uri,'_blank','noopener,noreferrer');if(!win)alert('浏览器阻止了弹窗；请允许在新标签打开你的本地 PDF。');e.target.value='';setTimeout(()=>URL.revokeObjectURL(uri),120000)};document.getElementById('guideBtn').onclick=()=>alert('本版已包含 W1–W4 与可点击关系图。单篇导出：右上角「导出 Obsidian .md」。请将文件放入 Obsidian Vault 的 01 Literature Notes/。概念链接 [[Object Integrity]] 可在 Obsidian 创建对应卡片。定期导出备份 JSON 并安全保存。本版不是实时双向同步。');

 ['w1-clavir-1998','w4-clavir-2002','Professional values → Indigenous perspectives'],

 ['w1-hagerman-2023','w2-viollet-1854','Restoration theory as historical context'],
 ['w2-ruskin-1849','w2-morris-1877','Anti-restoration / original fabric'],
 ['w2-viollet-1854','w2-ruskin-1849','Restoration vs anti-restoration'],
 ['w2-brandi-1963','w2-pye-2001','Work of art vs object in use'],
 ['w2-fowler-2019','w4-riegl-1903','Age value ↔ historical value'],
 ['w2-morris-1877','w4-riegl-1903','History layers ↔ age value'],
 ['w2-ruskin-1849','w3-staniforth-2010','Care and maintenance before restoration'],
 ['w3-wickens-2024','w3-staniforth-2010','Context-based sustainability'],
 ['w3-wickens-2024','w3-fatoric-2023','Sustainability and human factors'],
 ['w3-fatoric-2023','w4-balenquah-2008','Climate resilience ↔ living culture'],
 ['w4-riegl-1903','w4-clavir-2002','Heritage values ↔ cultural authority'],
 ['w4-clavir-2002','w4-balenquah-2008','Community definitions of care'],
 ['w1-clavir-1998','w2-fowler-2019','Scientific authority ↔ material evidence'],
 ['w1-caple-2000','w4-riegl-1903','Reasons for preservation ↔ assigned values'],
 ['w1-venice-charter','w2-morris-1877','Historic layering'],

];
const weekColors={'Week 1':'#6181b6','Week 2':'#bc7d69','Week 3':'#5ca089','Week 4':'#a17ebd'};
let mapView='all',mapWeek=4;
function wk(a){return Number((a.week.match(/Week (\d+)/)||[])[1]||0)}
function graphSvg(nodes,edges){
 const n=nodes.length;if(!n)return '<p>暂无节点</p>';
 let W=850,H=570,cx=W/2,cy=H/2;
 const pos={}; nodes.forEach((a,i)=>{let group=wk(a),members=nodes.filter(x=>wk(x)===group);let j=members.findIndex(x=>x.id===a.id);let isAll=mapView==='all',bases={1:[190,145],2:[650,140],3:[185,422],4:[650,422]};let bx=isAll?bases[group][0]:cx,by=isAll?bases[group][1]:cy;let r=isAll?Math.min(112,36+members.length*11):Math.max(120,members.length*28);let t=(Math.PI*2*j/members.length)-Math.PI/2;pos[a.id]={x:bx+r*Math.cos(t),y:by+r*Math.sin(t)};});
 let lines=edges.map(([u,v,label])=>{let a=pos[u],b=pos[v];if(!a||!b)return '';return `<line class="graph-edge" x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}"><title>${escapeHTML(label)}</title></line>`}).join('');
 let dots=nodes.map(a=>{let p=pos[a.id],name=a.id==='w1-aic-code'?'AIC':a.id==='w1-venice-charter'?'Venice':a.author.split(' ').slice(-1)[0],short=escapeHTML(name.length>13?name.slice(0,13)+'…':name);return `<g class="graph-node" data-graph-id="${escapeHTML(a.id)}" tabindex="0" role="button" aria-label="阅读 ${escapeHTML(a.author)}"><circle cx="${p.x}" cy="${p.y}" r="20" fill="${weekColors['Week '+wk(a)]||'#7287a5'}"></circle><text text-anchor="middle" x="${p.x}" y="${p.y+37}">${short}</text><title>${escapeHTML(a.title)}</title></g>`}).join('');
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Conservation theory article network">${lines}${dots}</svg>`;
}
function renderMap(){let all=state.articles.filter(a=>wk(a)>0&&wk(a)<=4),nodes=mapView==='all'?all:all.filter(a=>wk(a)===mapWeek),ids=new Set(nodes.map(x=>x.id)),edges=crossRelations.filter(e=>ids.has(e[0])&&ids.has(e[1]));let content=document.getElementById('content');
 content.innerHTML=`<div class="eyebrow">Course synthesis / Knowledge Network</div><h1 class="article-title">${mapView==='all'?'W1–W4 跨周关联导图':'Week '+mapWeek+' 本周阅读关联'}</h1><div class="meta">基于文献论点构建的解释性关联，连线代表可以比较的论题，并非作者彼此直接引用。</div><section class="section"><div class="map-switch"><button class="btn ${mapView==='week'?'primary':''}" id="switchWeek">本周关联</button><button class="btn ${mapView==='all'?'primary':''}" id="switchAll">跨周关联</button><select id="chooseWeek"><option value="1" ${mapWeek===1?'selected':''}>Week 1</option><option value="2" ${mapWeek===2?'selected':''}>Week 2</option><option value="3" ${mapWeek===3?'selected':''}>Week 3</option><option value="4" ${mapWeek===4?'selected':''}>Week 4</option></select></div><div class="legend">${[1,2,3,4].map(k=>`<span><b style="background:${weekColors['Week '+k]}"></b>W${k}</span>`).join('')}</div><div class="graph-box">${graphSvg(nodes,edges)}</div><p class="graph-text">点击圆点打开对应文章。悬停连线查看讨论主题。部分同周文章未连线表示尚未建立直接对比，不代表没有关系。</p></section><section class="section"><h2>可用于 reading response 的关联论题</h2>${edges.map(e=>`<div class="map-relation"><strong>${escapeHTML((all.find(a=>a.id===e[0])||{}).author||e[0])} ↔ ${escapeHTML((all.find(a=>a.id===e[1])||{}).author||e[1])}</strong><div>${escapeHTML(e[2])}</div></div>`).join('')||'<p>该周关联仍可从下方概念连接扩展。</p>'}<h3>如何建立新的 Obsidian 双向链接</h3><p>在单篇阅读笔记里添加 <code>[[Concept Name]]</code>，把一个观点连到课程的其他文章，并写出<strong>两人如何同意/反对</strong>，不要只连共同关键词。</p><button class="btn" id="mapMdBtn">导出当前关系图 .md</button></section>`;
 document.getElementById('switchWeek').onclick=()=>{mapView='week';renderMap()};document.getElementById('switchAll').onclick=()=>{mapView='all';renderMap()};document.getElementById('chooseWeek').onchange=e=>{mapWeek=Number(e.target.value);mapView='week';renderMap()};
 content.querySelectorAll('[data-graph-id]').forEach(g=>{function go(){state.selected=g.getAttribute('data-graph-id');save();render();window.scrollTo(0,0)}g.onclick=go;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
 document.getElementById('mapMdBtn').onclick=()=>{let rel=edges.map(([u,v,l])=>'- [['+all.find(a=>a.id===u).author+' '+all.find(a=>a.id===u).year+']] ↔ [['+all.find(a=>a.id===v).author+' '+all.find(a=>a.id===v).year+']] — '+l).join('\n');dl((mapView==='all'?'Course-Connections-W1-W4':'Week-'+mapWeek+'-Connections')+'.md','# '+(mapView==='all'?'Course Connections W1–W4':'Week '+mapWeek+' Reading Connections')+'\n\n'+rel+'\n','text/markdown;charset=utf-8')};
 nav();
}
document.getElementById('mapWeekBtn').onclick=()=>{mapWeek=wk(article());mapView='week';renderMap();window.scrollTo(0,0)};
document.getElementById('mapAllBtn').onclick=()=>{mapView='all';renderMap();window.scrollTo(0,0)};
